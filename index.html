<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BURN — Pay money. Get nothing.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 24px;
    }

    .hero {
      width: 100%;
    }

    /* BURN LOGO */
    .logo {
      color: #ff5a1f;
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 900;
      letter-spacing: 14px;
      margin-top: 35px;
      margin-bottom: 70px;
      padding-left: 14px;
    }

    /* TOTAL */
    .label {
      color: #666;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    .total {
      color: #fff;
      font-size: clamp(64px, 11vw, 150px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -5px;
      white-space: nowrap;
    }

    /* SLOGAN */
    .message {
      margin-top: 70px;
    }

    .slogan {
      font-size: clamp(26px, 3.5vw, 42px);
      line-height: 1.2;
      font-weight: 900;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .sub {
      margin-top: 16px;
      color: #666;
      font-size: 15px;
    }

    /* SOCIAL */
    .social {
      margin-top: 70px;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .social a {
      color: #555;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .social a:hover {
      color: #ff5a1f;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #333;
      font-size: 10px;
    }

    footer a {
      color: #444;
      text-decoration: none;
      margin: 0 10px;
    }

    @media (max-width: 600px) {
      .logo {
        margin-bottom: 75px;
      }

      .total {
        letter-spacing: -3px;
      }

      .message {
        margin-top: 55px;
      }

      .social {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>

<main>
  <div class="hero">

    <div class="logo">
      BURN
    </div>

    <div class="label">
      HUMANITY HAS BURNED
    </div>

    <div class="total" id="burnTotal">
      $0
    </div>

    <div class="message">

      <div class="slogan">
        PAY MONEY. GET NOTHING.
      </div>

      <div class="sub">
        No product. No reward. Just BURN.
      </div>

    </div>

    <div class="social">

      <a href="https://www.tiktok.com/@burnglobal"
         target="_blank">
        TIKTOK
      </a>

      <a href="https://www.instagram.com/burn_global/"
         target="_blank">
        INSTAGRAM
      </a>

      <a href="https://www.youtube.com/@burnglobal"
         target="_blank">
        YOUTUBE
      </a>

    </div>

  </div>
</main>

<footer>
  © 2026 BURN
  <a href="privacy.html">PRIVACY</a>
  <a href="delete-account.html">DELETE ACCOUNT</a>
</footer>


<script>
  // =========================================================
  // BURN — GLOBAL TOTAL
  // Supabase app_stats → id: global → total_burned
  // =========================================================

  const SUPABASE_URL =
    'https://henyqkihesudarbmefkh.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_MVxSAmIK6avA7wYCBSuGSg_0-5ApdIl';

  const TOTAL_ELEMENT =
    document.getElementById('burnTotal');


  // ---------------------------------------------------------
  // 숫자 표시
  // ---------------------------------------------------------

  function formatBurnTotal(value) {

    const number = Number(value);

    if (!Number.isFinite(number)) {
      return '$0';
    }

    return '$' + number.toLocaleString(
      'en-US',
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );
  }


  // ---------------------------------------------------------
  // Supabase에서 현재 총액 가져오기
  // ---------------------------------------------------------

  async function loadBurnTotal() {

    try {

      const response = await fetch(
        SUPABASE_URL +
        '/rest/v1/app_stats?id=eq.global&select=total_burned',
        {
          method: 'GET',

          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          },

          cache: 'no-store'
        }
      );


      if (!response.ok) {
        throw new Error(
          'Supabase request failed: ' +
          response.status
        );
      }


      const data = await response.json();


      if (
        Array.isArray(data) &&
        data.length > 0 &&
        data[0].total_burned !== undefined
      ) {

        TOTAL_ELEMENT.textContent =
          formatBurnTotal(
            data[0].total_burned
          );
      }

    } catch (error) {

      console.error(
        'Failed to load BURN total:',
        error
      );

      // 오류가 발생해도 사이트 자체는 정상 표시
      // 마지막 표시값을 그대로 유지
    }
  }


  // ---------------------------------------------------------
  // 최초 로딩
  // ---------------------------------------------------------

  loadBurnTotal();


  // ---------------------------------------------------------
  // 10초마다 총액 확인
  // 페이지 새로고침 필요 없음
  // ---------------------------------------------------------

  setInterval(
    loadBurnTotal,
    10000
  );

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BURN — Pay money. Get nothing.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 24px;
    }

    .hero {
      width: 100%;
    }

    /* BURN LOGO */
.logo {
  color: #ff5a1f;
  font-size: clamp(42px, 5vw, 68px);
  font-weight: 900;
  letter-spacing: 14px;
  margin-top: 35px;
  margin-bottom: 70px;
  padding-left: 14px;
}

    /* TOTAL */
    .label {
      color: #666;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 18px;
    }

    .total {
      color: #fff;
      font-size: clamp(64px, 11vw, 150px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -5px;
      white-space: nowrap;
    }

    /* SLOGAN */
    .message {
      margin-top: 70px;
    }

    .slogan {
  font-size: clamp(26px, 3.5vw, 42px);
  line-height: 1.2;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
}

    .sub {
      margin-top: 16px;
      color: #666;
      font-size: 15px;
    }

    /* SOCIAL */
    .social {
      margin-top: 70px;
      display: flex;
      justify-content: center;
      gap: 28px;
    }

    .social a {
      color: #555;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .social a:hover {
      color: #ff5a1f;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #333;
      font-size: 10px;
    }

    footer a {
      color: #444;
      text-decoration: none;
      margin: 0 10px;
    }

    @media (max-width: 600px) {
      .logo {
        margin-bottom: 75px;
      }

      .total {
        letter-spacing: -3px;
      }

      .message {
        margin-top: 55px;
      }

      .social {
        margin-top: 55px;
      }
    }
  </style>
</head>

<body>

<main>
  <div class="hero">

    <div class="logo">
      BURN
    </div>

    <div class="label">
      HUMANITY HAS BURNED
    </div>

    <div class="total">
      $2,033,126
    </div>

    <div class="message">

     <div class="slogan">
  PAY MONEY. GET NOTHING.
</div>

      <div class="sub">
        No product. No reward. Just BURN.
      </div>

    </div>

    <div class="social">

      <a href="https://www.tiktok.com/@burnglobal"
         target="_blank">
        TIKTOK
      </a>

      <a href="https://www.instagram.com/burn_global/"
         target="_blank">
        INSTAGRAM
      </a>

      <a href="https://www.youtube.com/@burnglobal"
         target="_blank">
        YOUTUBE
      </a>

    </div>

  </div>
</main>

<footer>
  © 2026 BURN
  <a href="privacy.html">PRIVACY</a>
  <a href="index.html">DELETE ACCOUNT</a>
</footer>

</body>
</html>
